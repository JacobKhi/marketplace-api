spring.application.name=marketplace

# ===============================================
# CONFIGURAÇÃO DO BANCO DE DADOS MYSQL
# ===============================================

# URL de conexão JDBC para o MySQL
# spring.datasource.url=jdbc:mysql://localhost:3306/marketplace_db?useSSL=false&serverTimezone=UTC

spring.datasource.url=jdbc:mysql://localhost:3306/marketplace_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Usuário e Senha
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ===============================================
# CONFIGURAÇÃO DO JPA/HIBERNATE
# ===============================================

# Define o "dialeto" que o Hibernate usará para se comunicar com o MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ação que o Hibernate tomará ao iniciar a aplicação. 'update' funciona bem.
#spring.jpa.hibernate.ddl-auto=update

# ATENÇÃO: Use 'create' apenas para este reset. Ele apaga TUDO.
spring.jpa.hibernate.ddl-auto=create-drop

# (Opcional) Mostra o SQL gerado no console
#spring.jpa.show-sql=true

# Chave secreta para a assinatura dos tokens JWT
api.security.token.secret=${JWT_SECRET}

# Habilita o log detalhado (DEBUG) apenas para o pacote do Spring Security
logging.level.org.springframework.security=DEBUG

# ============================
# STRIPE API KEYS (TESTE)
# ============================

stripe.api.secret-key=${STRIPE_SECRET_KEY}

stripe.api.public-key=${STRIPE_PUBLIC_KEY}
